name: APK yig'ish

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: npm paketlarini o'rnatish
        run: npm ci

      - name: Veb fayllarni Android loyihasiga ko'chirish
        run: npx cap sync android

      - name: APK yig'ish (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK nomini o'zgartirish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TilPlayer.apk

      - name: APK'ni yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: TilPlayer-apk
          path: TilPlayer.apk

      - name: Release yaratish (v* teglarida)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TilPlayer.apk
